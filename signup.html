<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Sign Up | Sunday School Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Tiro+Kannada&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            max-width: 500px;
            margin: 40px auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--primary-blue);
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        .btn-auth {
            width: 100%;
            padding: 12px;
            background-color: var(--secondary-blue);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
        }
        .auth-footer {
            margin-top: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="brand">
                <img src="logo.png" alt="Rehoboth Prayer House HD Logo" class="brand-logo">
                <div class="brand-text">
                    <h1>Rehoboth Prayer House</h1>
                    <p>Student Registration</p>
                </div>
            </div>
            <a href="index.html" class="btn btn-login-nav"><i class="fa-solid fa-house"></i> Home</a>
        </div>
    </header>

    <div class="auth-container">
        <img src="logo.png" style="width: 70px; margin-bottom: 15px;" alt="Logo">
        <h2>ಹೊಸ ವಿದ್ಯಾರ್ಥಿ ನೋಂದಣಿ (Sign Up)</h2>
        <p style="color: var(--text-muted); margin-bottom: 25px;">ಸಂಡೇ ಸ್ಕೂಲ್‌ಗೆ ಉಚಿತವಾಗಿ ಸೇರಿಕೊಳ್ಳಿ</p>
        
        <form onsubmit="event.preventDefault(); alert('Registration Successful! Redirecting to Student Dashboard...'); window.location.href='dashboard.html';">
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು (Full Name)</label>
                <input type="text" class="form-control" placeholder="Student Name" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-city"></i> ಜಿಲ್ಲೆ / ನಗರ (City / District in Karnataka)</label>
                <input type="text" class="form-control" placeholder="e.g. Mysuru, Bengaluru, Hubballi" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-phone"></i> ಪೋಷಕರ ವಾಟ್ಸಾಪ್ ಸಂಖ್ಯೆ (WhatsApp No)</label>
                <input type="tel" class="form-control" placeholder="WhatsApp Phone Number" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> ಪಾಸ್‌ವರ್ಡ್ (Create Password)</label>
                <input type="password" class="form-control" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-auth"><i class="fa-solid fa-user-plus"></i> Register & Enter / ನೋಂದಾಯಿಸಿ</button>
        </form>

        <div class="auth-footer">
            <p>ಈಗಾಗಲೇ ಖಾತೆ ಇದೆಯೇ? <a href="login.html" style="color: var(--secondary-blue); font-weight: 600;">ಇಲ್ಲಿ ಲಾಗಿನ್ ಆಗಿ (Login)</a></p>
        </div>
    </div>
</body>
</html>
